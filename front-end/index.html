<!--{% load static %}
-->
<!doctype html>
<html>
  <head>
    <!-- <link rel="stylesheet" href="{% static 'css/output.css' %}" />-->
    <link rel="stylesheet" href="../static/css/output.css" />
  </head>
  <body class="bg-green-300 text-black">
    <nav
      class="bg-gray-400 h-fit px-6 py-4 flex justify-around items-center relative"
    >
      <div class="white text-sm font-bold m-0">Hacker Warehouse</div>
      <div class="flex items-center justify-around align-middle translate-x-5 mr-8">
        <button
          onclick="showhome2()"
          class="mx-4 cursor-pointer my-auto relative hover:after:w-full after:absolute after:-bottom-1 after:left-0 after:h-0.5 after:w-0 after:bg-black after:transition-all after:duration-300 hover:bg-gray-600 px-1 py-1 rounded-md hover:scale-105 transition-colors duration-300 transition-transform hover:-translate-y-1"
        >
          Home
        </button>
        <button
          onclick="showhistory()"
          class="cursor-pointer my-auto relative hover:after:w-full after:absolute after:-bottom-1 after:left-0 after:h-0.5 after:w-0 after:bg-black after:transition-all after:duration-300 hover:bg-gray-600 px-1 py-1 rounded-md hover:scale-105 transition-colors duration-300 transition-transform hover:-translate-y-1"
        >
          History
        </button>
      </div>
      <form id="searchform" class="flex items-center gap-2 w-1/3">


        <div class="flex flex-1 items-center min-w-0">
          <input
            id="searchfeald"
            type="search"
            name="q"
            placeholder="Search..."
            class="min-w-0 flex-1 h-10 ml-6 rounded-2xl bg-amber-200 px-4 outline-none"
          />

          <button
            type="submit"
            class="ml-2 cursor-pointer transition-transform duration-300 hover:scale-120"
          >
            <i data-lucide="search" class="h-6 w-6"></i>
          </button>
        </div>
      </form>

      <select
      id="seitting"
      class="white text-sm font-bold cursor-pointer hover:after:w-full after:absolute after:-bottom-1 after:left-0 after:h-0.5 after:w-0 after:bg-black after:transition-all after:duration-300 hover:bg-gray-600 px-1 py-1 rounded-md hover:scale-105 transition-colors duration-300 transition-transform hover:-translate-y-1">
      <option value="logout">logout</option>
      <option value="themes">theme</option>
      </select>
      <!--
      <button
        class="white text-sm font-bold cursor-pointer hover:after:w-full after:absolute after:-bottom-1 after:left-0 after:h-0.5 after:w-0 after:bg-black after:transition-all after:duration-300 hover:bg-gray-600 px-1 py-1 rounded-md hover:scale-105 transition-colors duration-300 transition-transform hover:-translate-y-1"
      >
        Log out
      </button>
      -->
    </nav>
    <div class="" id="homepage">
      <div
        id="window"
        class="p-6 z-50 hidden mx-auto my-auto w-115 h-135 rounded-2xl bg-gray-500 fixed left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2"
      >
        <div class="w-full relative flex flex-row">
          <div
            id="chooseadd"
            class="flex-1 rounded-2xl border flex justify-center ml-5 mr-5"
          >
            <button
              id="addcat"
              class="flex-1 cursor-pointer p-3 rounded-l-2xl border-r bg-gray-600"
            >
              Add category
            </button>
            <button id="addpro" class="flex-1 cursor-pointer p-3">
              Add product
            </button>
            <button id="addvariants" class="flex-1 cursor-pointer border-l p-3">
              Add variants
            </button>
            <button
              id="addstock"
              class="flex-1 cursor-pointer border-l p-3 rounded-r-2xl"
            >
              Add stock
            </button>
          </div>
          <button
            onclick="hidewindow()"
            class="font-black h-fit py-2 px-4 bg-gray-600 rounded-4xl cursor-pointer justify-center items-center shadow-[0_4px_0_#999] transition-all duration-100 active:translate-y-1 active:shadow-[0_1px_0_#999] active:bg-gray-400"
          >
            X
          </button>
        </div>

        <form id="cat" class="mx-auto mt-8 flex w-4/5 flex-col gap-2">
          {% csrf_token %}
          <label for="catname">Category name</label>
          <input name="catname" type="text" class="border" id="catname" />
          <label for="catdes">Category description</label>
          <input name="catdes" type="text" class="border" id="catdes" />
          <label for="catdrop">Choose parents</label>
          <select id="catslect" class="border"></select>
          <input
            type="submit"
            class="border cursor-pointer w-fit mt-2 p-2 rounded-2xl shadow-black"
          />
        </form>
        <form id="var" class="hidden flex-col">
          <label for="varname">Variant name</label>
          <input name="varname" type="text" class="border" />
          <label for="productvar">Product</label>
          <input name="productvar" type="text" class="border" />
          <label for="varprice">Product price</label>
          <input name="varprice" type="number" min="0" class="border" />
          <label for="facvar">Factory price</label>
          <input type="number" min="0" name="facvar" class="border" />
          <input type="checkbox" checked hidden />
          <input
            type="submit"
            class="border cursor-pointer w-fit mt-2 p-2 rounded-2xl"
          />
        </form>
        <form id="stock" class="mx-auto mt-5 hidden w-4/5 flex-col gap-2">
          <label for="prostc">Variant</label>
          <select class="border" id="prostc"></select>
          <label for="stcprice">Stock price</label>
          <input type="number" min="0" name="stcprice" class="border" />
          <label for="stcfacprc">Factory price</label>
          <input type="number" min="0" name="stcfacprc" class="border" />
          <input type="checkbox" checked hidden />
          <input
            type="submit"
            class="border cursor-pointer w-fit mt-2 p-2 rounded-2xl"
          />
        </form>
        <form id="pro" class="mx-auto hidden flex-col">
          <label for="proanme">Product name</label>
          <input type="text" name="proname" class="border" />
          <label for="prodes">Product description</label>
          <input type="text" name="prodes" class="border" />
          <label for="procat">product category</label>
          <select class="border"></select>
          <label for="brand">Product brand</label>
          <input type="text" name="brand" class="border" />
          <input type="checkbox" checked hidden />
          <input
            type="submit"
            class="border cursor-pointer w-fit mt-2 p-2 rounded-2xl"
          />
        </form>
      </div>
      <button
        onclick="showwindow()"
        class="rounded-4xl bg-gray-400 w-10 h-10 absolute bottom-4 right-3 cursor-pointer justify-center items-center text-2xl font-bold shadow-[0_4px_0_#666] transition-all duration-100 active:translate-y-1 active:shadow-[0_1px_0_#666] active:bg-gray-400"
      >
        +
      </button>
      <div id="backdrop" class="hidden fixed inset-0 bg-black/40 z-40"></div>
      <div id="catdisplay" class="w-full h-full"></div>
      <div id="inventory-browser" class="w-full">
        <div class="flex items-center gap-3 mb-4 mt-3">
          <button
            id="browser-back"
            onclick="showRootCategories()"
            class="hidden rounded-xl bg-gray-600 px-4 py-2 text-white"
          >
            ← Back
          </button>

          <h1 id="browser-title" class="text-2xl font-bold">Categories</h1>
        </div>

        <div
          id="browser-grid"
          class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"
        ></div>
      </div>
    </div>
    <div id="historypage" class="hidden flex-col items-center">
      <div class="flex items-center justify-between w-full px-4 mt-2">
        <h1 class="text-center p-2 rounded-xl bg-amber-200 h-fit">
          Stock history
        </h1>

        <span id="numlogs" class="bg-amber-400 rounded-2xl p-2"></span>
      </div>
      <div></div>
      <div id="history-list" class="w-full max-w-4xl mt-4 space-y-2"></div>
    </div>
    <div class="flex items-center justify-between w-full px-4 mt-2"></div>
    <div></div>
  </body>
  <script>
    const catslect = document.getElementById("catslect");
    const browserTitle = document.getElementById("browser-title");
    const browserGrid = document.getElementById("browser-grid");
    const browserBack = document.getElementById("browser-back");
    const variantform = document.getElementById("var");
    const productform = document.getElementById("pro");
    const numlogs = document.getElementById("numlogs");
    const homepage = document.getElementById("homepage");
    const swindow = document.getElementById("window");
    const backdrop = document.getElementById("backdrop");
    const addstock = document.getElementById("addstock");
    const seitting = document.getElementById("seitting")
    const addcat = document.getElementById("addcat");
    let stockpressed = false;
    let catpresser = false;
    const addvariants = document.getElementById("addvariants");
    const cat = document.getElementById("cat");
    const addpro = document.getElementById("addpro");
    const searchfeald = document.getElementById("searchfeald");
    const stock = document.getElementById("stock");

    const csrfToken = document.querySelector(
      "[name=csrfmiddlewaretoken]",
    ).value;



    seitting.onclick = function(){
      
    }




    function createCard(title, description) {
      const card = document.createElement("div");

      card.className =
        "cursor-pointer rounded-2xl bg-white p-5 shadow transition hover:scale-[1.02]";

      card.innerHTML = `
        <h2 class="text-xl font-bold">
            ${title}
        </h2>

        <p class="text-sm text-gray-500">
            ${description}
        </p>
    `;

      return card;
    }
    let varpressed = false;
    let propressed = false;
    let categories = [];
    let products = [];

    async function loadInventory() {
      const [categoriesResponse, productsResponse] = await Promise.all([
        fetch("/api/categories/"),
        fetch("/api/products/"),
      ]);

      const categoriesData = await categoriesResponse.json();
      const productsData = await productsResponse.json();

      categories = categoriesData.results;
      products = productsData.results;
      catslect.innerHTML = `
  <option value="">No parent</option>
`;

      categories.forEach((category) => {
        catslect.innerHTML += `
    <option value="${category.id}">
      ${category.name}
    </option>
  `;
      });

      showRootCategories();
    }
    function showRootCategories() {
      browserTitle.textContent = "Categories";
      browserBack.classList.add("hidden");

      browserGrid.innerHTML = "";

      const rootCategories = categories.filter(
        (category) => category.parent === null,
      );

      rootCategories.forEach((category) => {
        const card = createCard(
          category.name,
          category.description || "No description",
        );

        card.addEventListener("click", () => {
          openCategory(category.id);
        });

        browserGrid.appendChild(card);
      });
    }
    function openCategory(categoryId) {
      const category = categories.find(
        (category) => category.id === categoryId,
      );

      browserTitle.textContent = category.name;
      browserBack.classList.remove("hidden");

      browserGrid.innerHTML = "";

      const subcategories = categories.filter(
        (category) => category.parent === categoryId,
      );

      const categoryProducts = products.filter(
        (product) => product.category === categoryId,
      );

      subcategories.forEach((subcategory) => {
        const card = createCard(
          subcategory.name,
          subcategory.description || "Category",
        );

        card.addEventListener("click", () => {
          openCategory(subcategory.id);
        });

        browserGrid.appendChild(card);
      });

      categoryProducts.forEach((product) => {
        const card = createProductCard(product);

        browserGrid.appendChild(card);
      });
    }
    function createProductCard(product) {
      const card = document.createElement("div");

      card.className =
        "cursor-pointer rounded-2xl bg-white p-5 shadow transition hover:scale-[1.02]";

      card.innerHTML = `
        <h2 class="text-xl font-bold">
            ${product.name}
        </h2>

        <p class="text-sm text-gray-500">
            ${product.brand || "No brand"}
        </p>

        <p class="mt-2 text-sm">
            ${product.variants.length} variants
        </p>
    `;

      card.addEventListener("click", () => {
        openProduct(product.id);
      });

      return card;
    }
    function openProduct(productId) {
      const product = products.find((product) => product.id === productId);

      browserTitle.textContent = product.name;
      browserGrid.innerHTML = "";

      product.variants.forEach((variant) => {
        const card = document.createElement("div");

        card.className = "rounded-2xl bg-white p-5 shadow";

        card.innerHTML = `
            <h2 class="text-lg font-bold">
                ${variant.name}
            </h2>

            <p class="text-sm text-gray-500">
                SKU: ${variant.sku}
            </p>

            <div class="mt-3 flex justify-between">
                <span>
                    Price
                </span>
                <span class="font-bold">
                    ${variant.price}
                </span>
            </div>

            <div class="flex justify-between">
                <span>
                    Stock
                </span>

                <span class="font-bold">
                    ${variant.quantity}
                </span>
            </div>
        `;

        browserGrid.appendChild(card);
      });
    }
    const searchform = document.getElementById("searchform");



    checkSearch();

    window.addEventListener("resize", checkSearch);
    async function loadhistory() {
      const response = await fetch("/api/stock-movements/");
      const history = await response.json();
      numlogs.innerText = `History logs number:${history.count}`;
      const historyList = document.getElementById("history-list");
      historyList.innerText = "";
      history.results.forEach((item) => {
        const card = document.createElement("div");

        if (item.quantity < 0) {
          card.className =
            "bg-red-300 rounded-xl p-4 shadow flex justify-between items-center border-l-red-500 border-l-3 hover:scale-105 duration:300 transition-all";
        } else if (item.quantity > 0) {
          card.className =
            "bg-green-500 rounded-xl p-4 shadow flex justify-between items-center border-l-green-700 border-l-3 hover:scale-105 duration:300 transition-all";
        }
        card.innerHTML = `
      <div>
        <h2 class="font-bold text-lg">
          ${item.variant_name}
        </h2>

        <p class="text-sm text-gray-600">
          SKU: ${item.sku}
        </p>

        <p class="text-sm">
          Reason: ${item.reason}
        </p>
      </div>

      <div class="text-right">
        <p class="font-bold">
          ${item.movement_type}
        </p>

        <p class="text-lg font-bold">
          ${item.quantity > 0 ? "+" : ""}${item.quantity}
        </p>

        <p class="text-sm text-gray-600">
          Balance: ${item.balance_after}
        </p>
      </div>
    `;

        historyList.appendChild(card);
      });
    }
    function showhistory() {
      homepage.classList.add("hidden");
      historypage.classList.remove("hidden");
      historypage.classList.add("flex");
      loadhistory();
    }
    function showhome2() {
      historypage.classList.remove("flex");
      historypage.classList.add("hidden");
      homepage.classList.remove("hidden");
    }
    function showhome() {}
    addcat.addEventListener("click", () => {
      catpresser = true;
      stockpressed = false;

      addcat.style.backgroundColor = "#4B5563";
      addstock.style.backgroundColor = "#6B7280";
    });

    addstock.addEventListener("click", () => {
      stockpressed = true;
      catpresser = false;

      addstock.style.backgroundColor = "#4B5563";
      addcat.style.backgroundColor = "#6B7280";
    });

    function showwindow() {
      swindow.classList.remove("hidden");
      backdrop.classList.remove("hidden");
    }
    function hidewindow() {
      swindow.classList.add("hidden");
      backdrop.classList.add("hidden");
    }

    addvariants.addEventListener("click", () => {
      catpresser = false;
      stockpressed = false;
      varpressed = true;
      propressed = false;
      addvariants.style.backgroundColor = "#4B5563";
      addstock.style.backgroundColor = "#6B7280";
      addcat.style.backgroundColor = "#6B7280";
      addpro.style.backgroundColor = "#6B7280";
      cat.style.display = "none";
      stock.style.display = "none";
      productform.style.display = "none";
      variantform.style.display = "flex";
    });
    addpro.addEventListener("click", () => {
      stockpressed = false;
      catpresser = false;
      varpressed = false;
      propressed = true;
      addpro.style.backgroundColor = "#4B5563";
      addcat.style.backgroundColor = "#6B7280";
      addstock.style.backgroundColor = "#6B7280";
      addvariants.style.backgroundColor = "#6B7280";
      cat.style.display = "none";
      stock.style.display = "none";
      productform.style.display = "flex";
      variantform.style.display = "none";
    });
    addcat.addEventListener("click", () => {
      catpresser = true;
      stockpressed = false;
      varpressed = false;
      propressed = false;
      addcat.style.backgroundColor = "#4B5563";
      addstock.style.backgroundColor = "#6B7280";
      addpro.style.backgroundColor = "#6B7280";
      addvariants.style.backgroundColor = "#6B7280";
      cat.style.display = "flex";
      stock.style.display = "none";
      productform.style.display = "none";
      variantform.style.display = "none";
    });
    addstock.addEventListener("click", () => {
      stockpressed = true;
      catpresser = false;
      varpressed = false;
      propressed = false;
      addstock.style.backgroundColor = "#4B5563";
      addcat.style.backgroundColor = "#6B7280";
      addpro.style.backgroundColor = "#6B7280";
      addvariants.style.backgroundColor = "#6B7280";
      cat.style.display = "none";
      stock.style.display = "flex";
      productform.style.display = "none";
      variantform.style.display = "none";
    });
    addcat.style.backgroundColor = "#4B5563";
    addstock.style.backgroundColor = "#6B7280";
    addstock.addEventListener("click", () => {
      stockpressed = true;
      catpresser = false;
      addstock.style.backgroundColor = "#4B5563";
      addcat.style.backgroundColor = "#6B7280";
    });
    loadInventory();
    cat.addEventListener("submit", async (event) => {
      event.preventDefault();
      const name = document.getElementById("catname").value;
      const description = document.getElementById("catdes").value;
      const parent = document.getElementById("catslect").value;
      const response = await fetch("/api/categories/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": csrfToken,
        },
        body: JSON.stringify({
          name: name,
          description: description,
          parent: parent === "" ? null : Number(parent),
        }),
      });
      const data = await response.json();
    });
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    lucide.createIcons();
  </script>
</html>
