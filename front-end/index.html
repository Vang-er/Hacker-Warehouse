  <body class="bg-green-300 text-black">
    <nav

        >
          Home
        </button>
        <button
          class="mx-2 cursor-pointer my-auto relative hover:after:w-full after:absolute after:-bottom-1 after:left-0 after:h-0.5 after:w-0 after:bg-black after:transition-all after:duration-300 hover:bg-gray-600 px-1 py-1 rounded-md hover:scale-105 transition-colors duration-300 transition-transform hover:-translate-y-1"
        >
          History
        </button>
      </div>
      <button
        class="white text-sm font-bold absolute right-1 cursor-pointer hover:after:w-full after:absolute after:-bottom-1 after:left-0 after:h-0.5 after:w-0 after:bg-black after:transition-all after:duration-300 hover:bg-gray-600 px-1 py-1 rounded-md hover:scale-105 transition-colors duration-300 transition-transform hover:-translate-y-1"

        <button

          class="cursor-pointer hover:scale-120 transition-all duration-300"

          <i data-lucide="search" class="w-10 h-10"></i>

      </form>

    <div
      id="window"
      class="p-6 z-50 hidden mx-auto my-auto w-95 h-115 rounded-2xl bg-gray-500 fixed left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2"
    >
      <div class="w-full relative">
        <button
          onclick="hidewindow()"
          class="font-black absolute right-2 top-2 py-2 px-4 bg-gray-600 rounded-4xl cursor-pointer justify-center items-center shadow-[0_4px_0_#999] transition-all duration-100 active:translate-y-1 active:shadow-[0_1px_0_#999] active:bg-gray-400"
        >
          X
        </button>
      </div>
      <div class="flex justify-around">
      <div id="chooseadd" class=" gap-4 rounded-2xl border absolute top-[20%] flex justify-center ml-5 mr-5">
        <button id="addcat" class=" cursor-pointer p-3 rounded-l-2xl">Add category / product</button>
        <hr>
        <button id="addvariants" class="cursor-pointer border-l p-3">Add variants</button>
        <hr>
        <button id="addstock" class="cursor-pointer border-l p-3 rounded-r-2xl">Add stock</button>

      </div>
     </div>

    <form id="cat" class="
    absolute top-2/5 flex flex-col
    ">
      <label for="catname">Category name</label>
      <input name="catname" type="text" class="border">
      <label for="catdes">Category description</label>
      <input name="catdes" type="text" class="border">
      
      <label for="catdrop">Choose parents</label>
      <select id="catslect" class="border">
        
      </select>
      <label for="catimg">Uplode img for category</label>
      <input class="border" type="file" id="catimg"  accept=".jpg, .jpeg, .png, .webp">
      <input type="submit" class="border cursor-pointer w-fit mt-2 p-2 rounded-2xl">
    </form>

    <div id="var">

    </div>
    
    <div id="stock">
      
    </div>






    </div>
    <button
      onclick="showwindow()"
      class="rounded-4xl bg-gray-400 w-10 h-10 absolute bottom-4 right-3 cursor-pointer justify-center items-center text-2xl font-bold shadow-[0_4px_0_#666] transition-all duration-100 active:translate-y-1 active:shadow-[0_1px_0_#666] active:bg-gray-400"
    >
      +
    </button>
    <div id="backdrop" class="hidden fixed inset-0 bg-black/40 z-40"></div>
  
  
  
  
  
  
  
  

  </body>
  <script>
    const swindow = document.getElementById("window");
    const backdrop = document.getElementById("backdrop");
    const addstock = document.getElementById("addstock");
    const addcat = document.getElementById("addcat");
    const addvariants = document.getElementById("addvariants")
    const cat = document.getElementById("cat")
    let stockpressed = false;
    let catpresser = false;
    let varpressed = false;
    
   
   
addvariants.addEventListener("click", () => {
    catpresser = false;
    stockpressed = false;
    varpressed = true;
    addvariants.style.backgroundColor = "#4B5563";
    addstock.style.backgroundColor = "#6B7280";
    addcat.style.backgroundColor = "#6B7280";
    cat.style.display = "none"
});

addcat.addEventListener("click", () => {
    catpresser = true;
    stockpressed = false;
    varpressed = false;
    addcat.style.backgroundColor = "#4B5563";
    addstock.style.backgroundColor = "#6B7280";
   addvariants.style.backgroundColor = "#6B7280";
      cat.style.display = "flex"

});

addstock.addEventListener("click", () => {
    stockpressed = true;
    catpresser = false;
    varpressed = false;
    addstock.style.backgroundColor = "#4B5563";
    addcat.style.backgroundColor = "#6B7280";
   addvariants.style.backgroundColor = "#6B7280";
     cat.style.display = "none"

});




    function showwindow() {
      swindow.classList.remove("hidden");
      backdrop.classList.remove("hidden");
    }
    function hidewindow() {
      swindow.classList.add("hidden");
      backdrop.classList.add("hidden");
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    lucide.createIcons();
  </script>
  
</html>
